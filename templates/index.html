<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Object Counter</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #video-container {
            margin-bottom: 20px;
            border: 1px solid black;
        }
        #video {
            width: 100%;
            height: auto;
        }
        .result {
            margin-top: 40px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Object Counter</h1>
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <button id="capture-btn">Capture and Count</button>
        <button id="torch-btn">Toggle Flashlight</button>
        <button id="select-btn">Select Object</button>
        <span id="selection-status" style="margin-left: 10px;"></span>

        <div class="result">
            <h2>Processed Image</h2>
            <img id="processed-img" src="" alt="Processed Image">
            <h3 id="object-count"></h3>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const torchBtn = document.getElementById('torch-btn');
        const selectBtn = document.getElementById('select-btn');
        const selectionStatus = document.getElementById('selection-status');
        const processedImg = document.getElementById('processed-img');
        const objectCount = document.getElementById('object-count');
        let torchOn = false;
        let selectionMode = false;

        // Access the user's camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                // Check if torch is supported
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                if (!capabilities.torch) {
                    torchBtn.disabled = true;
                }
            })
            .catch(err => {
                console.error("Error accessing camera: ", err);
            });

        torchBtn.addEventListener('click', () => {
            const track = video.srcObject.getVideoTracks()[0];
            torchOn = !torchOn;
            track.applyConstraints({
                advanced: [{torch: torchOn}]
            }).catch(e => console.error(e));
        });

        selectBtn.addEventListener('click', () => {
            selectionMode = !selectionMode;
            if (selectionMode) {
                selectionStatus.textContent = "Selection mode active: Tap on an object.";
                video.style.cursor = "crosshair";
            } else {
                selectionStatus.textContent = "";
                video.style.cursor = "default";
            }
        });

        function processFrame(selectionX = null, selectionY = null) {
            const MAX_WIDTH = 640;
            const MAX_HEIGHT = 480;
            let width = video.videoWidth;
            let height = video.videoHeight;

            if (width > height) {
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
            } else {
                if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg');

            let payload = { image: dataUrl };
            if (selectionX !== null && selectionY !== null) {
                payload.x = selectionX;
                payload.y = selectionY;
            }

            // Send the captured frame to the backend
            fetch('/process_frame', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                // Display the processed image and count
                processedImg.src = 'data:image/jpeg;base64,' + data.image;
                objectCount.textContent = 'Object Count: ' + data.count;
            })
            .catch(err => {
                console.error("Error processing frame: ", err);
            });
        }

        captureBtn.addEventListener('click', () => {
            processFrame();
        });

        video.addEventListener('click', (event) => {
            if (!selectionMode) {
                return;
            }

            // Calculate click coordinates as a percentage of the video dimensions
            const rect = video.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;

            processFrame(x, y);

            // Exit selection mode
            selectionMode = false;
            selectionStatus.textContent = "";
            video.style.cursor = "default";
        });
    </script>
</body>
</html>
