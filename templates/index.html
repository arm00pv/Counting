<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Object Counter</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #video-container {
            margin-bottom: 20px;
            border: 1px solid black;
            position: relative; /* Needed for absolute positioning of child */
        }
        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
        #video {
            width: 100%;
            height: auto;
            cursor: default;
        }
        .controls {
            margin-bottom: 10px;
        }
        .target-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            min-height: 50px;
        }
        #target-preview-img {
            border: 1px solid #ccc;
            margin-left: 10px;
            margin-right: 10px;
            max-height: 50px;
        }
        .result {
            margin-top: 40px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Object Counter</h1>
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="drawing-canvas" style="display: none;"></canvas>
        </div>
        <div class="controls">
            <button id="select-target-btn">Select Target</button>
            <button id="count-matches-btn">Count Matches</button>
            <button id="count-all-btn">Count All</button>
            <button id="torch-btn">Toggle Flashlight</button>
        </div>
        <div id="target-info" class="target-info">
            <span>Target:</span>
            <img id="target-preview-img" src="" alt="Target Preview" style="display: none;">
            <span id="target-status">None selected.</span>
        </div>

        <div class="result">
            <h2>Processed Frame</h2>
            <img id="processed-img" src="" alt="Processed Image">
            <h3 id="object-count"></h3>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const video = document.getElementById('video');
        const torchBtn = document.getElementById('torch-btn');
        const selectTargetBtn = document.getElementById('select-target-btn');
        const countMatchesBtn = document.getElementById('count-matches-btn');
        const countAllBtn = document.getElementById('count-all-btn');
        const targetPreviewImg = document.getElementById('target-preview-img');
        const targetStatus = document.getElementById('target-status');
        const processedImg = document.getElementById('processed-img');
        const objectCount = document.getElementById('object-count');

        // --- State Variables ---
        let torchOn = false;
        let selectionMode = false;
        let selectedTargetImgData = null;

        // --- Camera Setup ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                const track = stream.getVideoTracks()[0];
                if (!track.getCapabilities().torch) {
                    torchBtn.disabled = true;
                }
            })
            .catch(err => console.error("Error accessing camera: ", err));

        // --- Event Listeners & Drawing Logic ---
        const drawingCanvas = document.getElementById('drawing-canvas');
        const ctx = drawingCanvas.getContext('2d');
        let drawing = false;
        let startPos = { x: 0, y: 0 };

        torchBtn.addEventListener('click', () => {
            const track = video.srcObject.getVideoTracks()[0];
            torchOn = !torchOn;
            track.applyConstraints({ advanced: [{torch: torchOn}] }).catch(e => console.error(e));
        });

        selectTargetBtn.addEventListener('click', () => {
            // Prepare canvas for drawing
            const rect = video.getBoundingClientRect();
            drawingCanvas.width = rect.width;
            drawingCanvas.height = rect.height;
            drawingCanvas.style.display = 'block';
            targetStatus.textContent = "Draw a box around the target object.";
        });

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            // Handle touch events
            if (evt.touches) {
                return {
                    x: evt.touches[0].clientX - rect.left,
                    y: evt.touches[0].clientY - rect.top
                };
            }
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            drawing = true;
            startPos = getMousePos(drawingCanvas, e);
        }

        function draw(e) {
            e.preventDefault();
            if (!drawing) return;
            const currentPos = getMousePos(drawingCanvas, e);
            ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 2;
            ctx.strokeRect(startPos.x, startPos.y, currentPos.x - startPos.x, currentPos.y - startPos.y);
        }

        function stopDrawing(e) {
            e.preventDefault();
            if (!drawing) return;
            drawing = false;
            const endPos = getMousePos(drawingCanvas, e);

            // Hide canvas
            drawingCanvas.style.display = 'none';
            ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);

            // Get the rectangle dimensions, ensuring width/height are positive
            const rect = {
                x: Math.min(startPos.x, endPos.x),
                y: Math.min(startPos.y, endPos.y),
                w: Math.abs(startPos.x - endPos.x),
                h: Math.abs(startPos.y - endPos.y)
            };

            if (rect.w < 10 || rect.h < 10) { // Ignore tiny boxes
                targetStatus.textContent = "Selection too small. Try again.";
                return;
            }

            // --- Crop the selection from the video frame ---
            const videoRect = video.getBoundingClientRect();
            // Create a canvas to hold the full video frame
            const frameCanvas = document.createElement('canvas');
            frameCanvas.width = videoRect.width;
            frameCanvas.height = videoRect.height;
            frameCanvas.getContext('2d').drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);

            // Create a canvas to hold the cropped image
            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = rect.w;
            croppedCanvas.height = rect.h;
            // Crop from the frame canvas to the cropped canvas
            croppedCanvas.getContext('2d').drawImage(frameCanvas, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);

            // Set the cropped image as the target
            selectedTargetImgData = croppedCanvas.toDataURL('image/jpeg');
            targetPreviewImg.src = selectedTargetImgData;
            targetPreviewImg.style.display = 'inline';
            targetStatus.textContent = "Target selected.";
        }

        drawingCanvas.addEventListener('mousedown', startDrawing);
        drawingCanvas.addEventListener('mousemove', draw);
        drawingCanvas.addEventListener('mouseup', stopDrawing);
        drawingCanvas.addEventListener('mouseleave', stopDrawing);
        drawingCanvas.addEventListener('touchstart', startDrawing);
        drawingCanvas.addEventListener('touchmove', draw);
        drawingCanvas.addEventListener('touchend', stopDrawing);

        countAllBtn.addEventListener('click', () => {
            processFrame(null);
        });

        countMatchesBtn.addEventListener('click', () => {
            if (!selectedTargetImgData) {
                alert("Please select a target object first!");
                return;
            }
            processFrame(selectedTargetImgData);
        });

        // --- Backend Communication ---
        function getFrameDataUrl() {
            const MAX_WIDTH = 640;
            const MAX_HEIGHT = 480;
            let width = video.videoWidth;
            let height = video.videoHeight;

            if (width > height) {
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg');
        }

        function processFrame(targetImgData) {
            const frameData = getFrameDataUrl();
            let payload = { image: frameData };
            if (targetImgData) {
                payload.target_image = targetImgData;
            }

            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                processedImg.src = 'data:image/jpeg;base64,' + data.image;
                objectCount.textContent = 'Object Count: ' + data.count;
            })
            .catch(err => {
                console.error("Error processing frame: ", err);
            });
        }
    </script>
</body>
</html>
