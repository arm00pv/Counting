<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Object Counter</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #video-container {
            margin-bottom: 20px;
            border: 1px solid black;
        }
        #video {
            width: 100%;
            height: auto;
            cursor: default;
        }
        .controls {
            margin-bottom: 10px;
        }
        .target-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            min-height: 50px;
        }
        #target-preview-img {
            border: 1px solid #ccc;
            margin-left: 10px;
            margin-right: 10px;
            max-height: 50px;
        }
        .result {
            margin-top: 40px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Object Counter</h1>
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <div class="controls">
            <button id="select-target-btn">Select Target</button>
            <button id="count-matches-btn">Count Matches</button>
            <button id="count-all-btn">Count All</button>
            <button id="torch-btn">Toggle Flashlight</button>
        </div>
        <div id="target-info" class="target-info">
            <span>Target:</span>
            <img id="target-preview-img" src="" alt="Target Preview" style="display: none;">
            <span id="target-status">None selected.</span>
        </div>

        <div class="result">
            <h2>Processed Frame</h2>
            <img id="processed-img" src="" alt="Processed Image">
            <h3 id="object-count"></h3>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const video = document.getElementById('video');
        const torchBtn = document.getElementById('torch-btn');
        const selectTargetBtn = document.getElementById('select-target-btn');
        const countMatchesBtn = document.getElementById('count-matches-btn');
        const countAllBtn = document.getElementById('count-all-btn');
        const targetPreviewImg = document.getElementById('target-preview-img');
        const targetStatus = document.getElementById('target-status');
        const processedImg = document.getElementById('processed-img');
        const objectCount = document.getElementById('object-count');

        // --- State Variables ---
        let torchOn = false;
        let selectionMode = false;
        let selectedTargetImgData = null;

        // --- Camera Setup ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                const track = stream.getVideoTracks()[0];
                if (!track.getCapabilities().torch) {
                    torchBtn.disabled = true;
                }
            })
            .catch(err => console.error("Error accessing camera: ", err));

        // --- Event Listeners ---
        torchBtn.addEventListener('click', () => {
            const track = video.srcObject.getVideoTracks()[0];
            torchOn = !torchOn;
            track.applyConstraints({ advanced: [{torch: torchOn}] }).catch(e => console.error(e));
        });

        selectTargetBtn.addEventListener('click', () => {
            selectionMode = true;
            targetStatus.textContent = "Active: Tap an object in the video.";
            video.style.cursor = "crosshair";
        });

        countAllBtn.addEventListener('click', () => {
            processFrame(null);
        });

        countMatchesBtn.addEventListener('click', () => {
            if (!selectedTargetImgData) {
                alert("Please select a target object first!");
                return;
            }
            processFrame(selectedTargetImgData);
        });

        video.addEventListener('click', (event) => {
            if (!selectionMode) return;

            const rect = video.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;

            getTargetImage(x, y);

            selectionMode = false;
            targetStatus.textContent = "Acquiring target...";
            video.style.cursor = "default";
        });

        // --- Backend Communication ---
        function getFrameDataUrl() {
            const MAX_WIDTH = 640;
            const MAX_HEIGHT = 480;
            let width = video.videoWidth;
            let height = video.videoHeight;

            if (width > height) {
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg');
        }

        function getTargetImage(x, y) {
            const frameData = getFrameDataUrl();
            fetch('/get_target_at_coords', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: frameData, x: x, y: y })
            })
            .then(response => response.json())
            .then(data => {
                if (data.target_image) {
                    selectedTargetImgData = data.target_image;
                    targetPreviewImg.src = 'data:image/jpeg;base64,' + selectedTargetImgData;
                    targetPreviewImg.style.display = 'inline';
                    targetStatus.textContent = "Target selected.";
                } else {
                    selectedTargetImgData = null;
                    targetPreviewImg.style.display = 'none';
                    targetStatus.textContent = "No object found at selection. Try again.";
                }
            })
            .catch(err => {
                console.error("Error getting target: ", err);
                targetStatus.textContent = "Error selecting target.";
            });
        }

        function processFrame(targetImgData) {
            const frameData = getFrameDataUrl();
            let payload = { image: frameData };
            if (targetImgData) {
                payload.target_image = targetImgData;
            }

            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                processedImg.src = 'data:image/jpeg;base64,' + data.image;
                objectCount.textContent = 'Object Count: ' + data.count;
            })
            .catch(err => {
                console.error("Error processing frame: ", err);
            });
        }
    </script>
</body>
</html>
