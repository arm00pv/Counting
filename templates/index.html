<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Object Counter</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #view-container {
            margin-bottom: 10px;
            border: 1px solid black;
            position: relative; /* Needed for absolute positioning of children */
            background-color: #eee;
            /* Aspect ratio box */
            height: 0;
            padding-top: 75%; /* 4:3 aspect ratio */
        }
        #view-container > video, #view-container > canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #drawing-canvas {
            cursor: crosshair;
        }
        .controls {
            margin-bottom: 10px;
        }
        .target-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            min-height: 50px;
        }
        #target-preview-img {
            border: 1px solid #ccc;
            margin-left: 10px;
            margin-right: 10px;
            max-height: 50px;
        }
        .result {
            margin-top: 40px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Object Counter</h1>
        <div id="view-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="snapshot-canvas" style="display: none;"></canvas>
            <canvas id="drawing-canvas" style="display: none;"></canvas>
        </div>
        <div class="controls">
            <button id="capture-btn">Capture Image</button>
            <button id="retake-btn" style="display: none;">Retake</button>
            <button id="select-target-btn" disabled>Select Target</button>
            <button id="analyze-btn" disabled>Analyze</button>
            <button id="torch-btn">Toggle Flashlight</button>
        </div>
        <div id="target-info" class="target-info">
            <span>Target:</span>
            <img id="target-preview-img" src="" alt="Target Preview" style="display: none;">
            <span id="target-status">Capture an image first.</span>
        </div>

        <div class="result">
            <h2>Analysis Result</h2>
            <img id="processed-img" src="" alt="Processed Result" style="display: none;">
            <h3 id="object-count"></h3>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const video = document.getElementById('video');
        const snapshotCanvas = document.getElementById('snapshot-canvas');
        const drawingCanvas = document.getElementById('drawing-canvas');
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const selectTargetBtn = document.getElementById('select-target-btn');
        const analyzeBtn = document.getElementById('analyze-btn');
        const torchBtn = document.getElementById('torch-btn');
        const targetPreviewImg = document.getElementById('target-preview-img');
        const targetStatus = document.getElementById('target-status');
        const processedImg = document.getElementById('processed-img');
        const objectCount = document.getElementById('object-count');

        // --- State Variables ---
        let capturedImageData = null;
        let selectedTargetImgData = null;
        let drawing = false;
        let startPos = { x: 0, y: 0 };

        // --- Camera Setup ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                const track = stream.getVideoTracks()[0];
                if (!track.getCapabilities().torch) {
                    torchBtn.disabled = true;
                }
            })
            .catch(err => console.error("Error accessing camera: ", err));

        // --- UI Update Functions ---
        function setLiveMode(isLive) {
            video.style.display = isLive ? 'block' : 'none';
            snapshotCanvas.style.display = isLive ? 'none' : 'block';
            captureBtn.style.display = isLive ? 'inline-block' : 'none';
            retakeBtn.style.display = isLive ? 'none' : 'inline-block';
            selectTargetBtn.disabled = isLive;
            analyzeBtn.disabled = isLive;
            if (isLive) {
                targetStatus.textContent = "Capture an image first.";
                targetPreviewImg.style.display = 'none';
                processedImg.style.display = 'none';
                objectCount.textContent = "";
            }
        }

        // --- Event Listeners ---
        captureBtn.addEventListener('click', () => {
            const sCtx = snapshotCanvas.getContext('2d');
            snapshotCanvas.width = video.videoWidth;
            snapshotCanvas.height = video.videoHeight;
            sCtx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
            capturedImageData = snapshotCanvas.toDataURL('image/jpeg');
            setLiveMode(false);
            targetStatus.textContent = "Image captured. Select a target or analyze.";
        });

        retakeBtn.addEventListener('click', () => {
            capturedImageData = null;
            selectedTargetImgData = null;
            setLiveMode(true);
        });

        selectTargetBtn.addEventListener('click', () => {
            const dCtx = drawingCanvas.getContext('2d');
            drawingCanvas.width = snapshotCanvas.width;
            drawingCanvas.height = snapshotCanvas.height;
            drawingCanvas.style.display = 'block';
            targetStatus.textContent = "Draw a box around the target object.";
        });

        analyzeBtn.addEventListener('click', () => {
            let payload = { image: capturedImageData };
            if (selectedTargetImgData) {
                payload.target_image = selectedTargetImgData.split(',')[1]; // Send only base64 part
            }
            processFrame(payload);
        });

        torchBtn.addEventListener('click', () => {
            const track = video.srcObject.getVideoTracks()[0];
            track.applyConstraints({ advanced: [{torch: !track.getSettings().torch}] }).catch(e => console.error(e));
        });

        // --- Drawing Logic ---
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }
        function startDrawing(e) { e.preventDefault(); drawing = true; startPos = getMousePos(drawingCanvas, e); }
        function draw(e) {
            e.preventDefault(); if (!drawing) return;
            const currentPos = getMousePos(drawingCanvas, e);
            const dCtx = drawingCanvas.getContext('2d');
            dCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            dCtx.strokeStyle = "red"; dCtx.lineWidth = 2;
            dCtx.strokeRect(startPos.x, startPos.y, currentPos.x - startPos.x, currentPos.y - startPos.y);
        }
        function stopDrawing(e) {
            e.preventDefault(); if (!drawing) return; drawing = false;
            const endPos = getMousePos(drawingCanvas, e);
            drawingCanvas.style.display = 'none';
            drawingCanvas.getContext('2d').clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);

            const rect = {
                x: Math.min(startPos.x, endPos.x), y: Math.min(startPos.y, endPos.y),
                w: Math.abs(startPos.x - endPos.x), h: Math.abs(startPos.y - endPos.y)
            };
            if (rect.w < 10 || rect.h < 10) { targetStatus.textContent = "Selection too small. Try again."; return; }

            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = rect.w; croppedCanvas.height = rect.h;
            croppedCanvas.getContext('2d').drawImage(snapshotCanvas, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);

            selectedTargetImgData = croppedCanvas.toDataURL('image/jpeg');
            targetPreviewImg.src = selectedTargetImgData;
            targetPreviewImg.style.display = 'inline';
            targetStatus.textContent = "Target selected. Ready to analyze.";
        }
        drawingCanvas.addEventListener('mousedown', startDrawing);
        drawingCanvas.addEventListener('mousemove', draw);
        drawingCanvas.addEventListener('mouseup', stopDrawing);
        drawingCanvas.addEventListener('mouseleave', (e) => { if(drawing) stopDrawing(e); });
        drawingCanvas.addEventListener('touchstart', startDrawing);
        drawingCanvas.addEventListener('touchmove', draw);
        drawingCanvas.addEventListener('touchend', stopDrawing);

        // --- Backend Communication ---
        function processFrame(payload) {
            targetStatus.textContent = "Analyzing...";
            objectCount.textContent = "";
            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                processedImg.src = 'data:image/jpeg;base64,' + data.image;
                processedImg.style.display = 'block';
                objectCount.textContent = 'Object Count: ' + data.count;
                targetStatus.textContent = "Analysis complete.";
            })
            .catch(err => {
                console.error("Error processing frame: ", err);
                targetStatus.textContent = "Analysis failed.";
            });
        }
    </script>
</body>
</html>
